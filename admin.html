<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://*.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'"><meta name="referrer" content="no-referrer"><script>if(window.top!==window.self)document.documentElement.style.display="none"</script><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>HYPE 後台</title>
<meta name="theme-color" content="#141414"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HYPE後台"><link rel="manifest" href="admin.webmanifest"><link rel="apple-touch-icon" href="admin-180.png"><link rel="icon" href="admin-192.png">
<script src="theme.js"></script><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="wrap">
  <div class="top"><h1>後台 <small id="me" style="font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0"></small></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="themeBtn" type="button">🌙</button><a class="btn" href="./" target="_blank">看前台</a><button id="setBtn" class="admOnly" hidden>設定</button><button class="pri" id="addBtn" hidden>＋ 發布</button></div>
  </div>
  <div class="tabs" id="tabs" hidden><button data-tab="items" class="on">商品</button><button data-tab="brands" class="admOnly">品牌</button><button data-tab="cats" class="admOnly">分類</button><button data-tab="sales" class="admOnly">銷售紀錄</button><button data-tab="review" class="admOnly revOnly" hidden>審核 <span id="revN"></span></button><span style="flex:1"></span><button id="csvItems" class="admOnly">匯出商品 CSV</button></div>
</div></header>
<main class="wrap">
  <div id="login" class="dlg" style="max-width:480px;margin:40px auto" hidden>
    <h2>登入</h2>
    <label>GitHub Token（Contents 讀寫權限）</label><input id="tok" type="password" autocomplete="off">
    <div class="msg" id="lMsg"></div>
    <div style="font-size:12px;color:var(--mute);margin-top:6px">iPhone 建議從「加入主畫面」的 App 登入，只要輸入一次</div>
    <div class="row"><button type="button" id="pasteBtn">📋 貼上</button><button class="pri" id="loginBtn">登入</button></div>
  </div>
  <section id="pItems"><div id="subNote" class="panel" hidden style="margin-bottom:0"></div><div class="filters" id="byBar" hidden style="padding-top:12px"><select id="byF"></select></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>還沒有商品，按「＋ 發布」</div></section>
  <section id="pBrands" hidden></section>
  <section id="pCats" hidden></section>
  <section id="pSales" hidden></section>
  <section id="pReview" hidden></section>
</main>
<div class="bar" id="bar" hidden><b id="selN"></b><button data-batch="available">可購買</button><button data-batch="reserved">保留中</button><button data-batch="sold">已售出</button><button data-batch="delete" class="danger">刪除</button><button data-batch="none">取消選取</button></div>

<dialog id="formDlg"><form class="dlg" id="form" method="dialog">
  <h2 id="formTitle">發布商品</h2>
  <label>品牌</label><input id="fBrand" list="brandList" required placeholder="例：Supreme"><datalist id="brandList"></datalist>
  <label>商品名稱</label><input id="fName" required>
  <div class="two">
    <div><label>大分類</label><select id="fGrp"></select></div>
    <div><label>小分類</label><select id="fCat"></select></div>
    <div><label>尺寸</label><input id="fSize" list="sizeList" placeholder="M / US 9 / F"><datalist id="sizeList"></datalist></div>
    <div><label>狀況</label><select id="fCond"></select></div>
    <div><label>狀態</label><select id="fStatus"><option value="available">可購買</option><option value="reserved">保留中</option><option value="sold">已售出</option></select></div>
    <div><label>售價 (NT$)</label><input id="fPrice" type="number" min="0" inputmode="numeric"></div>
    <div><label>原價（有填才顯示折扣）</label><input id="fOrig" type="number" min="0" inputmode="numeric"></div>
    <div><label>限時特價結束（要填原價）</label><input id="fSaleEnd" type="datetime-local"></div>
    <div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;color:var(--fg);margin:8px 0 0"><input type="checkbox" id="fHot"> 🔥 手動標熱門</label></div>
    <div><label>庫存數量</label><input id="fQty" type="number" min="0" inputmode="numeric" value="1"></div>
    <div><label>成本（加密，不公開）</label><input id="fCost" type="number" min="0" inputmode="numeric"></div>
  </div>
  <div id="costHint" style="font-size:12px;color:var(--mute)" hidden>到「銷售紀錄」解鎖後才能填成本</div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="fHidden"> 草稿（先不公開，前台看不到）</label>
  <label>描述</label><textarea id="fDesc" placeholder="尺寸細節、購入管道…"></textarea>
  <label>照片（拖曳或用 ← → 排序，第一張為封面）</label><label class="btn" for="fPhotos" style="display:inline-flex;color:var(--fg);margin:0;cursor:pointer">＋ 加照片</label><input id="fPhotos" type="file" accept="image/*" multiple hidden>
  <div class="thumbs" id="thumbs"></div>
  <div class="msg" id="fMsg"></div>
  <div class="row" id="editRow" hidden style="justify-content:flex-start"><button type="button" id="sellBtn" class="admOnly">記錄成交</button><button type="button" id="igPost">IG 貼文圖</button><button type="button" id="dup">複製商品</button><button type="button" id="withdraw" hidden>撤回投稿</button><button type="button" class="danger" id="del">刪除</button></div>
  <div class="row acts"><button type="button" id="cancel">取消</button><button class="pri" id="save" type="submit">發布</button></div>
</form></dialog>

<dialog id="saleDlg"><form class="dlg" id="saleForm" method="dialog">

  <div class="two">
    <div><label>成交單價</label><input id="sPrice" type="number" min="0" required></div>
    <div><label>單件成本</label><input id="sCost" type="number" min="0"></div>

  <label>備註</label><input id="sNote">
  <div class="msg" id="saleMsg"></div>
  <div class="row"><button type="button" id="saleCancel">取消</button><button class="pri" type="submit">儲存</button></div>
</form></dialog>

<dialog id="igDlg"><div class="dlg">
  <h2>IG 圖片</h2><div class="seg" id="igMode" style="margin-bottom:10px"><button type="button" data-m="post" class="on">貼文 4:5</button><button type="button" data-m="story">限動 9:16</button></div><img id="igImg" style="width:100%;max-height:55vh;object-fit:contain;background:#000;border-radius:8px;display:block" alt="">
  <label>文案</label><textarea id="igCap" style="min-height:120px"></textarea>

<dialog id="sizeEdDlg"><div class="dlg">
  <h2 id="szTitle">尺寸表</h2>
  <div style="font-size:13px;color:var(--mute)">一行一列，用逗號分隔；第一行是標題。<button type="button" id="szTplC" style="padding:2px 10px;font-size:12px">衣服範本</button> <button type="button" id="szTplS" style="padding:2px 10px;font-size:12px">鞋子範本</button></div>
  <textarea id="szText" style="min-height:160px;font-family:ui-monospace,monospace;margin-top:8px"></textarea>
  <label>預覽</label><div id="szPrev" style="overflow-x:auto"></div>
  <div class="msg" id="szMsg"></div>
  <div class="row"><button type="button" id="szCancel">取消</button><button class="pri" id="szSave">儲存</button></div>
</div></dialog>

<dialog id="setDlg"><form class="dlg" id="setForm" method="dialog">
  <h2>網站設定</h2>
  <label>網站名稱</label><input id="sTitle">
  <label>公告橫幅（留空不顯示）</label><input id="sNotice" placeholder="例：本週新到貨！10/20–10/25 暫停出貨">
  <label>關於我們（# 開頭是標題，- 開頭是條列）<button type="button" id="aboutTpl" style="padding:2px 10px;font-size:12px;margin-left:6px">套用範本</button></label><textarea id="sAbout" style="min-height:120px" placeholder="留空不顯示"></textarea>
  <label>購物須知（# 開頭是標題，- 開頭是條列）<button type="button" id="infoTpl" style="padding:2px 10px;font-size:12px;margin-left:6px">套用範本</button></label><textarea id="sInfo" style="min-height:140px" placeholder="留空不顯示"></textarea>
  <label>IG 帳號（不含 @）</label><input id="sIg" placeholder="your_ig">
  <label>LINE（ID、@官方帳號 或 加好友連結）</label><input id="sLine" placeholder="@xxx 或 https://line.me/...">
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="sWm"> 上傳照片自動加浮水印</label>
  <label>浮水印文字（留空用 @IG帳號）</label><input id="sWmText">
  <label>下單表單：Google 表單「預先填入」連結（商品欄填 ITEM，留空不顯示下單）</label><input id="sForm" placeholder="https://docs.google.com/forms/d/e/.../viewform?usp=pp_url&entry.123=ITEM">
  <label>瀏覽統計 GoatCounter 代碼（<b>代碼</b>.goatcounter.com）</label><input id="sGc" placeholder="hypeshop">
  <div id="gcLink" style="font-size:13px;margin-top:4px"></div><div style="margin-top:6px"><button type="button" id="viewsBtn" style="padding:4px 12px;font-size:13px">🔥 立即更新熱門</button> <span id="viewsMsg" style="font-size:12px;color:var(--mute)"></span></div>
  <div class="msg" id="sMsg"></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="sReview"> 🛡 審核制：成員的發布、修改、刪除要經過你核准才生效</label>
  <div id="protMsg" style="font-size:12px;margin-top:4px"></div>
  <label>管理員（GitHub 帳號，一行一個；你自己永遠是管理員。審核制開啟時只有 repo 擁有者能核准）</label><textarea id="sAdmins" style="min-height:70px" placeholder="例：friend123"></textarea>
  <div style="font-size:12px;color:var(--mute)">其他被邀請的人是「一般成員」：只能發布、編輯、刪除自己的商品，看不到品牌、分類、銷售紀錄、設定。</div>
  <label>手機登入用</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" id="copyTok">📋 複製 Token</button><span style="font-size:12px;color:var(--mute)">複製後用 LINE 傳給自己，再貼到手機後台</span></div>
  <div class="row acts"><button type="button" id="logout">登出</button><button type="button" id="sCancel">取消</button><button class="pri" type="submit">儲存</button></div>
</form></dialog>

<script>
const OWNER="910618john",REPO="hype-shop",BRANCH="main",API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const BASE=new URL("./",location.href).href;
const GROUPS=[{name:"衣服",subs:["上衣","襯衫","帽T / 衛衣","針織 / 毛衣","外套","褲子","短褲"]},{name:"鞋子",subs:["球鞋","靴子","拖鞋 / 涼鞋","皮鞋"]},{name:"飾品",subs:["項鍊","手環","戒指","耳環","手錶"]},{name:"包包",subs:["後背包","側背包","托特包","皮夾"]},{name:"配件",subs:["帽子","皮帶","襪子","其他"]}],CONDS=["全新未拆","全新","近全新","9成新","8成新","7成新以下"],NEWC=["全新未拆","全新"],SIZES=["XS","S","M","L","XL","XXL","F","US 7","US 8","US 9","US 10","US 11"];
const ST={available:"可購買",reserved:"保留中",sold:"已售出"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n||n===0?"NT$ "+Number(n).toLocaleString():"";
const num=v=>v===""||v==null?null:Number(v);
const status=i=>i.status||(i.sold?"sold":"available");
const ls={get(k){try{return localStorage.getItem(k)||""}catch{return ""}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch{}}};
let token=ls.get("gh_token"),data={site:{},items:[]},sha=null,editing=null,pending=[],sel=new Set(),tab="items";
let me="",byF="";
let priv=null,privSha=null,privState="none",privKey=null,privSalt=null;

// ---------- GitHub ----------
let WB=BRANCH; // 寫入的分支：管理員寫 main，送審成員寫自己的 submit/帳號 分支
async function api(url,opt={}){const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`+url,{...opt,headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},cache:"no-store"});
  if(r.status===204)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message||r.status);e.status=r.status;throw e}return j}
async function gh(path,opt={},br=WB){
  const r=await fetch(API+path+(opt.method?"":"?ref="+encodeURIComponent(br)),{...opt,headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},cache:"no-store"});
  if(!r.ok){let m=(await r.json().catch(()=>({}))).message||r.status;if(/rule|protected branch/i.test(m))m="main 分支受保護，你的帳號不能直接修改，請管理員開啟「審核制」";const e=new Error(m);e.status=r.status;throw e}
  return r.json();
}
const bytesB64=b=>{let o="";for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o)};
const b64bytes=s=>Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0));
const b64utf8=s=>bytesB64(new TextEncoder().encode(s));
const utf8b64=s=>new TextDecoder().decode(b64bytes(s));
function blobB64(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(b)})}
async function shaOf(path,br=WB){try{return (await gh(path,{},br)).sha}catch{return null}}
async function putFile(path,content,msg,br=WB){const s=await shaOf(path,br);return gh(path,{method:"PUT",body:JSON.stringify({message:msg,content,branch:br,...(s?{sha:s}:{})})})}
async function delFile(path,br=WB){const s=await shaOf(path,br);if(s)await gh(path,{method:"DELETE",body:JSON.stringify({message:"刪除 "+path,sha:s,branch:br})}).catch(()=>{})}
const inUse=p=>data.items.some(i=>(i.photos||[]).includes(p))||mine.some(m=>(m.item?.photos||[]).includes(p))||Object.values(data.site.logos||{}).includes(p);
const th=p=>/^img\/\d+-[a-z0-9]+\.jpg$/.test(p)?p.replace(/\.jpg$/,"_t.jpg"):null;
async function cleanup(paths){for(const p of paths)if(!inUse(p)){await delFile(p);if(th(p))await delFile(th(p))}}

let saveQ=Promise.resolve();const serial=f=>{const p=saveQ.then(f,f);saveQ=p.catch(()=>{});return p};
async function load(){const f=await gh("data.json");sha=f.sha;data=JSON.parse(utf8b64(f.content));data.site??={};data.items??=[];render()}
function save(msg){return serial(async()=>{
  try{const r=await gh("data.json",{method:"PUT",body:JSON.stringify({message:msg,content:b64utf8(JSON.stringify(data,null,2)),sha,branch:BRANCH})});sha=r.content.sha;render()}
  catch(e){if(e.status===409){await load();throw new Error("資料已被其他裝置更新，已重新載入，請再操作一次")}throw e}
})}

// ---------- 加密的銷售資料 (private.json) ----------
async function deriveKey(pass,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
const kv={db:null,open(){return this.db??=new Promise((res,rej)=>{const r=indexedDB.open("hype",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch{return undefined}},
  async set(k,v){try{const d=await this.open();await new Promise(res=>{const t=d.transaction("kv","readwrite"),o=t.objectStore("kv");v===undefined?o.delete(k):o.put(v,k);t.oncomplete=t.onerror=()=>res()})}catch{}}};
let privEnv=null;
async function loadPriv(){
  try{const f=await gh("private.json");privSha=f.sha;privEnv=JSON.parse(utf8b64(f.content));privSalt=b64bytes(privEnv.salt);privState="locked";
    let key=await kv.get("privKey");const old=ls.get("hs_pass");if(!key&&old)key=await deriveKey(old,privSalt);ls.set("hs_pass","");
    if(key)await openWith(key).then(()=>kv.set("privKey",key)).catch(()=>kv.set("privKey"))}
  catch(e){if(e.status===404)privState="none";else throw e}
}
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64bytes(privEnv.iv)},key,b64bytes(privEnv.ct)).catch(()=>{throw new Error("密碼錯誤")});
  priv=JSON.parse(new TextDecoder().decode(pt));priv.costs??={};priv.sales??=[];privKey=key;privState="open";
}
async function unlock(pass){const key=await deriveKey(pass,b64bytes(privEnv.salt));await openWith(key);await kv.set("privKey",key)}
function savePriv(msg){return serial(async()=>{
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},privKey,new TextEncoder().encode(JSON.stringify(priv))));
  const env={v:1,salt:bytesB64(privSalt),iv:bytesB64(iv),ct:bytesB64(ct)};privEnv=env;
  try{const r=await gh("private.json",{method:"PUT",body:JSON.stringify({message:msg,content:b64utf8(JSON.stringify(env)),branch:BRANCH,...(privSha?{sha:privSha}:{})})});privSha=r.content.sha}
  catch(e){if(e.status===409){await loadPriv();throw new Error("銷售資料已被其他裝置更新，已重新載入，請再操作一次")}throw e}
})}
async function createPriv(pass){privSalt=crypto.getRandomValues(new Uint8Array(16));privKey=await deriveKey(pass,privSalt);priv={costs:{},sales:[]};privState="open";await kv.set("privKey",privKey);await savePriv("建立加密銷售資料")}

// ---------- 商品頁 (SEO + 分享預覽) / sitemap ----------
function productPage(i){
  const s=status(i),title=`${i.brand} ${i.name}`,siteT=data.site.title||"HYPE",url=BASE+"p/"+i.id+".html",img=i.photos?.[0]?BASE+i.photos[0]:"";
  const d=[s!=="available"?ST[s]:"",fmt(i.price),i.size,i.condition].filter(Boolean).join(" · ")+(i.desc?" — "+i.desc.slice(0,120):"");
  const ld={"@context":"https://schema.org","@type":"Product",name:title,brand:{"@type":"Brand",name:i.brand},image:(i.photos||[]).map(p=>BASE+p),description:i.desc||title,url,
    ...(i.price!=null?{offers:{"@type":"Offer",price:i.price,priceCurrency:"TWD",availability:"https://schema.org/"+(s==="sold"?"SoldOut":"InStock"),itemCondition:"https://schema.org/"+(NEWC.includes(i.condition)?"NewCondition":"UsedCondition"),url}}:{})};
  const go=`../#${i.id}`;
  return `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)} | ${esc(siteT)}</title><meta name="description" content="${esc(d)}"><link rel="canonical" href="${esc(url)}">
<meta property="og:title" content="${esc(title)}"><meta property="og:description" content="${esc(d)}"><meta property="og:type" content="product"><meta property="og:url" content="${esc(url)}">
${img?`<meta property="og:image" content="${esc(img)}"><meta name="twitter:card" content="summary_large_image">`:""}
<script type="application/ld+json">${JSON.stringify(ld).replace(/</g,"\\u003c")}<\/script><script src="../theme.js"><\/script><link rel="stylesheet" href="../style.css"></head>
<body><header><div class="wrap"><div class="top"><h1><a href="../" style="text-decoration:none">${esc(siteT)}</a></h1><span style="display:flex;gap:8px"><button class="themeBtn" type="button">🌙</button><a class="btn pri" href="${go}">查看 / 詢問</a></span></div></div></header>
<main class="wrap" style="max-width:640px;padding:20px 16px 60px"><div class="brand">${esc(i.brand)}${s!=="available"?` · <span style="color:var(--danger)">${ST[s]}</span>`:""}</div>

const writePage=i=>i.hidden?delFile("p/"+i.id+".html"):putFile("p/"+i.id+".html",b64utf8(productPage(i)),"商品頁："+i.name).catch(()=>{});
const writeSitemap=()=>putFile("sitemap.xml",b64utf8(`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>${BASE}</loc></url>\n${data.items.filter(i=>!i.hidden).map(i=>`<url><loc>${BASE}p/${i.id}.html</loc></url>`).join("\n")}\n</urlset>\n`),"更新 sitemap").catch(()=>{});

// ---------- 權限（介面限制） ----------
const lc=v=>String(v||"").toLowerCase();
let review=false,repoAdmin=false,mine=[];
const submitter=()=>review&&!repoAdmin&&!!me;
const isAdm=()=>review?(repoAdmin||!me):(!me||lc(me)===lc(OWNER)||(data.site.admins||[]).some(a=>lc(a)===lc(me)));
const canEdit=i=>submitter()?(!!i&&i.by===me):(isAdm()||(!!i&&!!me&&i.by===me));
function applyRole(){const a=isAdm();document.querySelectorAll(".admOnly").forEach(e=>{if(e.id==="setBtn"&&$("tabs").hidden)return;e.hidden=!a});
  $("me").textContent=me?`@${me} · ${a?"管理員":submitter()?"成員（送審）":"成員"}`:"";
  document.querySelectorAll(".revOnly").forEach(e=>e.hidden=!(a&&review&&repoAdmin));if(!a&&tab!=="items"){tab="items";setTab("items")}}
// ---------- 商品列表 ----------
function render(){
  applyRole();
  const who=[...new Set(data.items.map(i=>i.by||""))];
  $("byBar").hidden=who.length<2&&!who.some(w=>w&&w!==me);
  $("byF").innerHTML=`<option value="">全部發布者（${data.items.length}）</option>`+(me?`<option value="@me">只看我發的（${data.items.filter(i=>i.by===me).length}）</option>`:"")+who.filter(w=>w!==me).map(w=>`<option value="${esc(w)}">${w?"@"+esc(w):"未記錄"}（${data.items.filter(i=>(i.by||"")===w).length}）</option>`).join("");$("byF").value=byF;if($("byF").value!==byF){byF="";$("byF").value=""}
  const base=submitter()?viewItems():data.items;
  $("subNote").hidden=!submitter();if(submitter())$("subNote").innerHTML=`📝 你的發布、修改、刪除都要等管理員核准才會上架${mine.length?`（目前 <b>${mine.length}</b> 件審核中）`:""}`;
  const items=[...base].filter(i=>!byF||(byF==="@me"?i.by===me:(i.by||"")===byF)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $("brandList").innerHTML=allBrands().map(b=>`<option value="${esc(b)}">`).join("");
  $("sizeList").innerHTML=[...new Set([...SIZES,...items.map(i=>i.size).filter(Boolean)])].map(s=>`<option value="${esc(s)}">`).join("");
  $("grid").innerHTML=items.map(i=>{const s=status(i);return `<div class="card${s==="sold"?" sold":""}" data-id="${esc(i.id)}">
    ${i.photos?.[0]?`<img class="ph" loading="lazy" decoding="async" src="${esc(srcOf(th(i.photos[0])||i.photos[0]))}" data-full="${esc(srcOf(i.photos[0]))}" alt="">`:`<div class="ph"></div>`}
    ${canEdit(i)&&!submitter()?`<input type="checkbox" class="chk" data-chk="${esc(i.id)}"${sel.has(i.id)?" checked":""}>`:""}
    <div class="badges">${i._p?`<span class="badge" style="background:#1d6fe0">${i._p==="del"?"刪除審核中":"審核中"}</span>`:""}${i.hidden?`<span class="badge" style="background:#6b6b6b">草稿</span>`:""}${s==="sold"?`<span class="badge">SOLD</span>`:s==="reserved"?`<span class="badge reserved">保留中</span>`:""}</div>
    <div class="meta"><div class="brand">${esc(i.brand)}</div><div class="name">${esc(i.name)}</div><div class="price">${fmt(i.price)}${i.qty>1?` <span class="stock">×${i.qty}</span>`:""}</div><div style="font-size:12px;color:var(--mute)">${i.by?`👤 ${esc(i.by)} `:""}${i.hot?"🔥 ":""}${(data.site.views||{})[i.id]!=null?"👁 "+data.site.views[i.id]:""}${i.saleEnd?` ⏰ 到 ${new Date(i.saleEnd).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`:""}</div>
    <select data-st="${esc(i.id)}"${canEdit(i)&&!submitter()?"":" disabled"}>${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===s?" selected":""}>${v}</option>`).join("")}</select></div></div>`}).join("");
  $("empty").hidden=items.length>0;
  for(const id of sel)if(!data.items.some(i=>i.id===id))sel.delete(id);
  $("bar").hidden=!sel.size||tab!=="items";$("selN").textContent=`已選 ${sel.size} 件`;
  if(tab==="review")renderReview();if(tab==="sales")renderSales();if(tab==="brands")renderBrands();if(tab==="cats")renderCats();
}
$("grid").onclick=e=>{if(e.target.closest("select,.chk"))return;const c=e.target.closest(".card");if(!c)return;const it=(submitter()?viewItems():data.items).find(i=>i.id===c.dataset.id);if(!canEdit(it))return alert(`這是 @${it.by||"其他人"} 發布的商品，只有發布者或管理員可以編輯`);openForm(it)};
$("grid").onchange=async e=>{
  const c=e.target.closest("[data-chk]");if(c){c.checked?sel.add(c.dataset.chk):sel.delete(c.dataset.chk);render();return}
  const sl=e.target.closest("[data-st]");if(!sl)return;const it=data.items.find(i=>i.id===sl.dataset.st);if(!it||!canEdit(it)||submitter())return render();const old=status(it);
  sl.disabled=true;it.status=sl.value;delete it.sold;
  try{await save(ST[it.status]+"："+it.name);writePage(it)}catch(err){it.status=old;alert(err.message);render()}
};
$("bar").onclick=async e=>{
  const a=e.target.dataset.batch;if(!a)return;if(a==="none"){sel.clear();render();return}
  const list=data.items.filter(i=>sel.has(i.id)&&canEdit(i));if(!list.length)return;sel=new Set(list.map(i=>i.id));
  if(a==="delete"){if(!confirm(`確定刪除 ${list.length} 件商品？`))return;data.items=data.items.filter(i=>!sel.has(i.id))}
  else list.forEach(i=>{i.status=a;delete i.sold});
  $("bar").querySelectorAll("button").forEach(b=>b.disabled=true);
  try{await save(`批次${a==="delete"?"刪除":ST[a]}：${list.length} 件`);sel.clear();render();
    if(a==="delete"){for(const i of list)await delFile("p/"+i.id+".html");await cleanup(list.flatMap(i=>i.photos||[]));await writeSitemap()}else for(const i of list)await writePage(i)}
  catch(err){alert(err.message);await load()}
  $("bar").querySelectorAll("button").forEach(b=>b.disabled=false);
};

// ---------- 商品表單 ----------
function openForm(it,asCopy=false){
  editing=asCopy?null:it||null;$("formTitle").textContent=asCopy?"複製商品":it?"編輯商品":"發布商品";$("save").textContent=editing?"儲存":"發布";$("editRow").hidden=!editing;
  const opt=(l,v)=>`<option value="">—</option>`+[...l,...(v&&!l.includes(v)?[v]:[])].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("fGrp").innerHTML=opt(groups().map(g=>g.name),it?.group);$("fGrp").value=it?groupOf(it):"";fillSubs(it?.category);$("fCond").innerHTML=opt(CONDS,it?.condition);
  $("fBrand").value=it?.brand||"";$("fName").value=it?.name||"";$("fSize").value=asCopy?"":it?.size||"";
  $("fCond").value=it?.condition||"";$("fPrice").value=it?.price??"";$("fOrig").value=it?.origPrice??"";$("fSaleEnd").value=it?.saleEnd&&!asCopy?toLocal(it.saleEnd):"";$("fHot").checked=!!it?.hot&&!asCopy;$("fQty").value=asCopy?1:it?.qty??1;
  $("fStatus").value=asCopy?"available":it?status(it):"available";$("fDesc").value=it?.desc||"";$("fHidden").checked=!!it?.hidden&&!asCopy;
  const open=privState==="open";$("fCost").disabled=!open;$("costHint").hidden=open;$("fCost").value=open&&it?priv.costs[it.id]??"":"";
  $("withdraw").hidden=!(submitter()&&editing&&mine.some(m=>m.id===editing.id));
  pending=(it?.photos||[]).map(p=>({path:p,url:srcOf(p)}));$("fPhotos").value="";$("fMsg").textContent=asCopy?"已複製，請修改尺寸等資料後發布":"";drawThumbs();
  if(!$("formDlg").open)$("formDlg").showModal();
}
function drawThumbs(){$("thumbs").innerHTML=pending.map((p,k)=>`<div draggable="true" data-k="${k}"><img src="${esc(p.url)}">${k===0?`<span class="cover">封面</span>`:""}<b data-x="${k}">×</b><div class="ctl"><i data-m="${k},-1">←</i><i data-m="${k},1">→</i></div></div>`).join("")}
function move(from,to){if(to<0||to>=pending.length||from===to)return;pending.splice(to,0,pending.splice(from,1)[0]);drawThumbs()}
$("thumbs").onclick=e=>{const x=e.target.dataset.x,m=e.target.dataset.m;if(x!=null){pending.splice(+x,1);drawThumbs()}if(m){const[k,d]=m.split(",").map(Number);move(k,k+d)}};
let dragK=null;
$("thumbs").ondragstart=e=>{const d=e.target.closest("[data-k]");if(d){dragK=+d.dataset.k;d.classList.add("drag")}};
$("thumbs").ondragover=e=>e.preventDefault();
$("thumbs").ondrop=e=>{e.preventDefault();const d=e.target.closest("[data-k]");if(d&&dragK!=null)move(dragK,+d.dataset.k);dragK=null};
$("thumbs").ondragend=()=>{dragK=null;drawThumbs()};
$("addBtn").onclick=()=>openForm();
$("cancel").onclick=()=>$("formDlg").close();
$("formDlg").addEventListener("close",()=>{const f=[...fresh];fresh=new Set();if(f.length)cleanup(f)});
$("dup").onclick=()=>openForm(editing,true);
$("withdraw").onclick=async()=>{if(!editing||!confirm("撤回這筆投稿？"))return;try{await subDel(editing.id);$("formDlg").close()}catch(err){$("fMsg").textContent=err.message}};

function shrink(file,{max=1600,type="image/jpeg",wm=""}={}){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas"),x=c.getContext("2d");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);x.drawImage(img,0,0,c.width,c.height);
    if(wm){const f=Math.max(16,Math.round(c.width*0.035));x.font=`700 ${f}px system-ui,sans-serif`;x.textAlign="center";x.textBaseline="bottom";
      x.shadowColor="rgba(0,0,0,.6)";x.shadowBlur=f/4;x.fillStyle="rgba(255,255,255,.85)";x.fillText(wm,c.width/2,c.height-f*.6)}
    URL.revokeObjectURL(u);c.toBlob(b=>res(b),type,.85)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(null)};img.src=u;})}
const wmText=()=>data.site.watermark===false?"":(data.site.wmText||(data.site.ig?"@"+data.site.ig:""));
async function uploadImg(blob,prefix,ext,path){path??=`img/${prefix}${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  await gh(path,{method:"PUT",body:JSON.stringify({message:"上傳圖片",content:await blobB64(blob),branch:WB})});return path}
let fresh=new Set();

$("fPhotos").onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;$("save").disabled=true;let n=0;
  if(submitter())try{await ensureBranch()}catch(err){$("fMsg").textContent="無法建立投稿分支："+err.message;$("save").disabled=false;return}
  for(const f of files){
    $("fMsg").textContent=`上傳中 ${++n}/${files.length}…`;
    const b=await shrink(f,{wm:wmText()}),t=await shrink(f,{max:600,wm:wmText()});if(!b){$("fMsg").textContent="無法讀取：「"+f.name+"」";continue}
    try{const path=await uploadImg(b,"","jpg");fresh.add(path);if(t)await uploadImg(t,"","jpg",th(path)).catch(()=>{});pending.push({path,url:URL.createObjectURL(b)});drawThumbs()}
    catch(err){$("fMsg").textContent="上傳失敗："+err.message}
  }
  if($("fMsg").textContent.startsWith("上傳中"))$("fMsg").textContent="";$("save").disabled=false;e.target.value="";
};

$("form").onsubmit=async e=>{
  e.preventDefault();
  const v={brand:$("fBrand").value.trim(),name:$("fName").value.trim(),group:$("fGrp").value,category:$("fCat").value,size:$("fSize").value.trim(),condition:$("fCond").value,
    price:num($("fPrice").value),origPrice:num($("fOrig").value),saleEnd:$("fSaleEnd").value?new Date($("fSaleEnd").value).getTime():null,hot:$("fHot").checked,qty:num($("fQty").value)??1,status:$("fStatus").value,desc:$("fDesc").value.trim(),photos:pending.map(p=>p.path),hidden:$("fHidden").checked};
  if(!v.brand||!v.name)return;
  if(v.saleEnd&&!(v.origPrice>v.price))return $("fMsg").textContent="限時特價要填「原價」，而且原價要高於售價";
  if(v.saleEnd&&v.saleEnd<=Date.now())return $("fMsg").textContent="特價結束時間要在未來";
  $("save").disabled=true;$("fMsg").textContent="儲存中…";
  let it=editing&&data.items.find(i=>i.id===editing.id);
  if(editing&&!it){$("save").disabled=false;return $("fMsg").textContent="這件商品已被刪除，請關閉視窗"}
  if(it&&!canEdit(it)){$("save").disabled=false;return $("fMsg").textContent="只有發布者或管理員可以編輯"}
  if(submitter()){try{const cur=editing&&viewItems().find(i=>i.id===editing.id);if(editing&&(!cur||cur.by!==me))throw new Error("只能修改自己的商品");
      const item={...(cur||{}),...v,id:cur?.id||Date.now().toString(36),by:me,createdAt:cur?.createdAt||Date.now()};delete item._p;delete item.sold;
      await subPut(item.id,{action:"upsert",item});editing=item;$("formDlg").close()}catch(err){$("fMsg").textContent="送出失敗："+err.message}
    $("save").disabled=false;return}
  const removed=(it?.photos||[]).filter(p=>!v.photos.includes(p)),isNewItem=!it,wasHidden=!!it?.hidden;
  try{
    if(it){Object.assign(it,v);delete it.sold}else{it={id:Date.now().toString(36),createdAt:Date.now(),by:me||undefined,...v};data.items.push(it)}if(isNewItem===false&&me)it.editedBy=me;
    data.site.brands=allBrands();
    await save((editing?"編輯：":"發布：")+v.name);
    if(privState==="open"){const c=num($("fCost").value);if((priv.costs[it.id]??null)!==c){c==null?delete priv.costs[it.id]:priv.costs[it.id]=c;await savePriv("更新成本")}}
    editing=it;$("formDlg").close();await writePage(it);if(isNewItem||wasHidden!==!!it.hidden)await writeSitemap();await cleanup(removed);
  }catch(err){if(isNewItem)data.items=data.items.filter(x=>x!==it);$("fMsg").textContent="儲存失敗："+err.message}
  $("save").disabled=false;
};
$("del").onclick=async()=>{
  if(!editing||!confirm("確定刪除「"+editing.name+"」？"))return;
  if(submitter()){try{const inMain=data.items.some(i=>i.id===editing.id&&i.by===me);if(inMain)await subPut(editing.id,{action:"delete",id:editing.id});else await subDel(editing.id);$("formDlg").close()}catch(err){$("fMsg").textContent="送出失敗："+err.message}return}
  const it=data.items.find(i=>i.id===editing.id);if(!it)return $("formDlg").close();if(!canEdit(it))return $("fMsg").textContent="只有發布者或管理員可以刪除";data.items=data.items.filter(i=>i!==it);
  try{await save("刪除："+it.name);$("formDlg").close();await delFile("p/"+it.id+".html");await cleanup(it.photos||[]);await writeSitemap()}
  catch(err){data.items.push(it);$("fMsg").textContent="刪除失敗："+err.message}
};

// ---------- 記錄成交 ----------
let saleFor=null;
$("sellBtn").onclick=()=>{
  if(!isAdm())return;
  if(privState!=="open"){alert("請先到「銷售紀錄」"+(privState==="none"?"設定密碼":"輸入密碼解鎖"));$("formDlg").close();setTab("sales");return}
  saleFor=editing;$("saleItem").textContent=`${saleFor.brand} ${saleFor.name}${saleFor.size?" / "+saleFor.size:""}`;
  $("sPrice").value=saleFor.price??"";$("sCost").value=priv.costs[saleFor.id]??"";$("sQty").value=1;$("sQty").max=Math.max(1,saleFor.qty??1);
  $("sDate").value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);$("sBuyer").value=$("sNote").value="";$("saleMsg").textContent="";$("saleDlg").showModal();
};
$("saleCancel").onclick=()=>$("saleDlg").close();
$("saleForm").onsubmit=async e=>{
  e.preventDefault();const it=data.items.find(i=>i.id===saleFor.id);if(!it){$("saleMsg").textContent="這件商品已被刪除";return}const q=Math.max(1,num($("sQty").value)||1);
  const rec={id:Date.now().toString(36),by:me||undefined,itemId:it.id,brand:it.brand,name:it.name,size:it.size||"",qty:q,price:num($("sPrice").value)||0,cost:num($("sCost").value),date:$("sDate").value,buyer:$("sBuyer").value.trim(),note:$("sNote").value.trim()};
  try{priv.sales.push(rec);if(rec.cost!=null&&priv.costs[it.id]==null)priv.costs[it.id]=rec.cost;await savePriv("成交："+it.name)}
  catch(err){priv.sales.pop();$("saleMsg").textContent=err.message;return}
  it.qty=Math.max(0,(it.qty??1)-q);if(it.qty===0){it.status="sold";delete it.sold}
  try{await save("成交："+it.name);await writePage(it)}catch(err){alert("成交已記錄，但更新庫存失敗："+err.message)}
  $("saleDlg").close();$("formDlg").close();
};

// ---------- 銷售紀錄頁 ----------
function setTab(t){tab=t;$("tabs").querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));$("pItems").hidden=t!=="items";$("pBrands").hidden=t!=="brands";$("pCats").hidden=t!=="cats";$("pSales").hidden=t!=="sales";$("pReview").hidden=t!=="review";render()}
$("tabs").onclick=e=>{const t=e.target.dataset.tab;if(t)setTab(t)};
function renderSales(){
  const P=$("pSales");
  if(privState==="none"){P.innerHTML=`<div class="panel" style="max-width:480px"><h2 style="margin-top:0">設定銷售紀錄密碼</h2><p style="color:var(--mute);font-size:14px">成本、成交價、買家資料會用這組密碼加密後才存到 GitHub。<b>忘記密碼就無法打開</b>，請記好。</p>
    <label>密碼</label><input type="password" id="pw1"><label>再輸入一次</label><input type="password" id="pw2"><div class="msg" id="pwMsg"></div><div class="row"><button class="pri" id="pwSet">建立</button></div></div>`;
    $("pwSet").onclick=async()=>{const a=$("pw1").value,b=$("pw2").value;if(a.length<6)return $("pwMsg").textContent="至少 6 個字";if(a!==b)return $("pwMsg").textContent="兩次密碼不同";
      $("pwSet").disabled=true;try{await createPriv(a);render()}catch(err){$("pwMsg").textContent=err.message;$("pwSet").disabled=false}};return}
  if(privState==="locked"){P.innerHTML=`<div class="panel" style="max-width:480px"><h2 style="margin-top:0">解鎖銷售紀錄</h2><label>密碼</label><input type="password" id="pw1"><div class="msg" id="pwMsg"></div><div class="row"><button class="pri" id="pwGo">解鎖</button></div></div>`;
    $("pwGo").onclick=async()=>{try{await unlock($("pw1").value);render()}catch(err){$("pwMsg").textContent=err.message}};return}
  const S=[...priv.sales].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const rev=s=>s.price*s.qty,cost=s=>(s.cost??0)*s.qty,mon=new Date().toISOString().slice(0,7);
  const sum=l=>({n:l.reduce((a,s)=>a+s.qty,0),r:l.reduce((a,s)=>a+rev(s),0),c:l.reduce((a,s)=>a+cost(s),0)});
  const m=sum(S.filter(s=>s.date.startsWith(mon))),all=sum(S),byM={};S.forEach(s=>(byM[s.date.slice(0,7)]??=[]).push(s));

// ---------- 銷售圖表 ----------
const kfmt=n=>Math.abs(n)>=1e4?(n/1e4).toFixed(Math.abs(n)>=1e5?0:1)+"萬":Number(n).toLocaleString();
function tipOn(box,el,html){let t=box.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";box.append(t)}
  el.onmouseenter=el.onclick=e=>{t.innerHTML=html;t.hidden=false;const b=box.getBoundingClientRect(),r=el.getBoundingClientRect();t.style.left=Math.min(b.width-t.offsetWidth-4,Math.max(4,r.left-b.left+r.width/2-t.offsetWidth/2))+"px";t.style.top=Math.max(4,r.top-b.top-t.offsetHeight-6)+"px"};
  el.onmouseleave=()=>{t.hidden=true}}
function drawCharts(S,rev,cost){
  const box=$("chM"),bb=$("chB");if(!S.length){box.hidden=bb.hidden=true;return}box.hidden=bb.hidden=false;
  // 每月營收 / 利潤（最近 12 個月）
  const now=new Date(),ms=[];for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  const first=S.map(s=>s.date.slice(0,7)).sort()[0],M=ms.filter((m,k)=>m>=first||k>=6);
  const v=M.map(m=>{const l=S.filter(s=>s.date.startsWith(m)),r=l.reduce((a,s)=>a+rev(s),0),c=l.reduce((a,s)=>a+cost(s),0);return{m,r,p:r-c,n:l.reduce((a,s)=>a+s.qty,0)}});
  const W=640,H=220,L=44,B=24,T=10,mx=Math.max(1,...v.map(x=>Math.max(x.r,x.p))),mn=Math.min(0,...v.map(x=>x.p));
  const nice=x=>{const e=10**Math.floor(Math.log10(x)),f=x/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e},step=nice((mx-mn)/4),top=Math.ceil(mx/step)*step,bot=Math.floor(mn/step)*step;
  const y=val=>T+(top-val)/(top-bot)*(H-T-B),cw=(W-L)/M.length,bw=Math.min(18,(cw-10)/2);
  let g="";for(let t=bot;t<=top+1e-9;t+=step)g+=`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="${t===0?"base":"grid"}"/><text x="${L-6}" y="${y(t)+4}" class="ax" text-anchor="end">${kfmt(t)}</text>`;
  const bar=(x,val,cls)=>{const y0=y(0),y1=y(val),h=Math.abs(y1-y0);if(!h)return "";const r=Math.min(4,h,bw/2);
    return val>=0?`<path class="${cls}" d="M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+bw-r}Q${x+bw},${y1} ${x+bw},${y1+r}V${y0}Z"/>`:`<path class="${cls}" d="M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+bw-r}Q${x+bw},${y1} ${x+bw},${y1-r}V${y0}Z"/>`};
  v.forEach((d,k)=>{const cx=L+cw*k+cw/2;g+=bar(cx-bw-1,d.r,"s1")+bar(cx+1,d.p,"s2")+`<text x="${cx}" y="${H-6}" class="ax" text-anchor="middle">${+d.m.slice(5)}月</text><rect class="hit" data-k="${k}" x="${L+cw*k}" y="${T}" width="${cw}" height="${H-T-B}"/>`});
  box.innerHTML=`<div class="chhead"><b>每月營收與利潤</b><span class="lg"><i class="s1"></i>營收 <i class="s2"></i>利潤</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月營收與利潤長條圖">${g}</svg>`;
  box.querySelectorAll(".hit").forEach(h=>{const d=v[+h.dataset.k];tipOn(box,h,`<b>${d.m}</b><br>營收 ${fmt(d.r)}<br>利潤 ${fmt(d.p)}<br>售出 ${d.n} 件`)});
  // 品牌營收排行
  const by={};S.forEach(s=>{const o=by[s.brand]??={r:0,p:0,n:0};o.r+=rev(s);o.p+=rev(s)-cost(s);o.n+=s.qty});
  const R=Object.entries(by).sort((a,b)=>b[1].r-a[1].r).slice(0,8),bm=Math.max(1,...R.map(x=>x[1].r)),rh=30,BW=W-130-90;
  let h="";R.forEach(([b,o],k)=>{const yy=k*rh+6,w=Math.max(2,o.r/bm*BW);h+=`<text x="122" y="${yy+15}" class="lb" text-anchor="end">${esc(b.length>12?b.slice(0,11)+"…":b)}</text>
    <path class="s1" d="M130,${yy}H${130+w-4}Q${130+w},${yy} ${130+w},${yy+4}V${yy+14}Q${130+w},${yy+18} ${130+w-4},${yy+18}H130Z"/><text x="${130+w+6}" y="${yy+14}" class="lb">${fmt(o.r)}</text>
    <rect class="hit" data-b="${k}" x="0" y="${yy-4}" width="${W}" height="${rh}"/>`});
  bb.innerHTML=`<div class="chhead"><b>品牌營收排行</b></div><svg viewBox="0 0 ${W} ${R.length*rh+8}" role="img" aria-label="品牌營收排行">${h}</svg>`;
  bb.querySelectorAll(".hit").forEach(x=>{const[b,o]=R[+x.dataset.b];tipOn(bb,x,`<b>${esc(b)}</b><br>營收 ${fmt(o.r)}<br>利潤 ${fmt(o.p)}<br>售出 ${o.n} 件`)});
}

function csv(name,rows){
  const t="\ufeff"+rows.map(r=>r.map(v=>{if(typeof v!=="number"&&/^[=+\-@\t\r]/.test(String(v??"")))v="'"+v;v=String(v??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=`${name}-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

const FIELDS={brand:"品牌",name:"名稱",group:"大分類",category:"小分類",size:"尺寸",condition:"狀況",price:"售價",origPrice:"原價",qty:"庫存",status:"狀態",desc:"描述",hidden:"草稿",saleEnd:"特價結束"};
function sanitize(it,login,cur){const o={},str=v=>String(v??"").slice(0,2000),n=v=>v===""||v==null||isNaN(+v)?null:+v;
  for(const k of ["brand","name","group","category","size","condition","desc"])o[k]=str(it[k]).trim();
  for(const k of ["price","origPrice","saleEnd"])o[k]=n(it[k]);o.qty=n(it.qty)??1;o.status=ST[it.status]?it.status:"available";o.hidden=!!it.hidden;

  if(cur){o.hot=!!cur.hot;o.by=cur.by;o.editedBy=login;o.createdAt=cur.createdAt}else{o.hot=false;o.by=login;o.createdAt=Date.now()}return o}

async function approve(r,btn){

    await api(`/pulls/${r.number}/merge`,{method:"PUT",body:JSON.stringify({merge_method:"squash",sha:r.sha,commit_title:`核准 @${r.login} 的投稿 (#${r.number})`})});
    await load();const changed=[],gone=[],drop=[];
    for(const sb of r.subs){const id=String(sb.id||"");if(!/^[a-z0-9]{4,20}$/.test(id))continue;const k=data.items.findIndex(i=>i.id===id),cur=data.items[k];

      if(sb.action==="delete"){if(cur){data.items.splice(k,1);gone.push(cur);drop.push(...(cur.photos||[]))}continue}
      if(sb.action!=="upsert"||!sb.item)continue;
      const it={id,...sanitize(sb.item,r.login,cur)};if(cur){drop.push(...(cur.photos||[]).filter(p=>!it.photos.includes(p)));data.items[k]=it}else data.items.push(it);changed.push(it)}

  }catch(err){alert("核准失敗："+err.message)}

async function reject(r,btn){
