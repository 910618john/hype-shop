<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPE 潮流精品</title>
<meta name="description" content="潮流精品 · 正品現貨，IG 私訊詢問">
<meta property="og:title" content="HYPE 潮流精品"><meta property="og:description" content="潮流精品 · 正品現貨，IG 私訊詢問"><meta property="og:type" content="website">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="wrap">
  <div class="top"><h1 id="title">HYPE</h1>
    <div style="display:flex;gap:8px;align-items:center"><input class="search" id="q" placeholder="搜尋商品"><a class="btn line" id="lineTop" target="_blank" rel="noopener" hidden>LINE</a><a class="btn ig" id="igTop" target="_blank" rel="noopener" hidden>IG</a></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="filters">
    <select id="fCat"><option value="">全部類別</option></select>
    <select id="fSize"><option value="">全部尺寸</option></select>
    <select id="fSort"><option value="new">最新上架</option><option value="asc">價格 低→高</option><option value="desc">價格 高→低</option></select>
    <button id="fAvail">只看可購買</button>
  </div>
</div></header>
<main class="wrap"><div class="logos" id="logos"></div><div class="grid" id="grid"></div><div class="empty" id="empty">載入中…</div></main>
<dialog id="viewDlg"><div id="view"></div></dialog>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n||n===0?"NT$ "+Number(n).toLocaleString():"";
const CATS=["上衣","外套","褲子","鞋","包","配件","其他"];
const ST={available:"",reserved:"保留中",sold:"已售出"};
const status=i=>i.status||(i.sold?"sold":"available");
const lineUrl=v=>/^https?:/.test(v)?v:v.startsWith("@")?"https://line.me/R/ti/p/"+encodeURIComponent(v):"https://line.me/ti/p/~"+encodeURIComponent(v);
const shareUrl=i=>new URL("p/"+i.id+".html",location.href.split("#")[0]).href;
let site={},items=[],brand="全部",onlyAvail=false;

function render(){
  const brands=[...new Set(items.map(i=>i.brand))].sort((a,b)=>a.localeCompare(b));
  $("chips").innerHTML=["全部",...brands].map(b=>`<button class="${b===brand?"on":""}" data-b="${esc(b)}">${esc(b)}${b==="全部"?"":" · "+items.filter(i=>i.brand===b).length}</button>`).join("");
  const logos=site.logos||{},q=$("q").value.trim().toLowerCase();
  $("logos").innerHTML=brand==="全部"&&!q&&brands.some(b=>logos[b])?brands.map(b=>`<div class="logo" data-b="${esc(b)}">${logos[b]?`<img src="${esc(logos[b])}" alt="">`:""}<span>${esc(b)}</span></div>`).join(""):"";
  const cat=$("fCat").value,size=$("fSize").value,sort=$("fSort").value;
  $("fAvail").classList.toggle("on",onlyAvail);
  let list=items.filter(i=>(brand==="全部"||i.brand===brand)&&(!cat||i.category===cat)&&(!size||i.size===size)&&(!onlyAvail||status(i)==="available")
    &&(!q||[i.name,i.brand,i.desc,i.category,i.size,i.condition].join(" ").toLowerCase().includes(q)));
  const p=i=>i.price??(sort==="asc"?Infinity:-Infinity);
  list.sort((a,b)=>(status(a)==="sold")-(status(b)==="sold")||(sort==="asc"?p(a)-p(b):sort==="desc"?p(b)-p(a):(b.createdAt||0)-(a.createdAt||0)));
  $("grid").innerHTML=list.map(i=>{const s=status(i);return `<div class="card${s==="sold"?" sold":""}" data-id="${esc(i.id)}">
    ${i.photos?.[0]?`<img class="ph" loading="lazy" src="${esc(i.photos[0])}" alt="">`:`<div class="ph"></div>`}
    ${s==="sold"?`<span class="badge">SOLD</span>`:s==="reserved"?`<span class="badge reserved">保留中</span>`:""}
    <div class="meta"><div class="brand">${esc(i.brand)}</div><div class="name">${esc(i.name)}</div><div class="price">${fmt(i.price)}</div>
    <div class="tags">${[i.condition,i.size,i.category].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div></div>`}).join("");
  $("empty").hidden=list.length>0;$("empty").textContent=items.length?"沒有符合的商品":"還沒有商品";
}
function fillFilters(){
  const cats=CATS.filter(c=>items.some(i=>i.category===c)),sizes=[...new Set(items.map(i=>i.size).filter(Boolean))].sort();
  $("fCat").innerHTML=`<option value="">全部類別</option>`+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  $("fSize").innerHTML=`<option value="">全部尺寸</option>`+sizes.map(s=>`<option>${esc(s)}</option>`).join("");
  $("fCat").hidden=!cats.length;$("fSize").hidden=!sizes.length;
}
$("chips").onclick=$("logos").onclick=e=>{const b=e.target.closest("[data-b]");if(b){brand=b.dataset.b;render();scrollTo({top:0})}};
$("q").oninput=$("fCat").onchange=$("fSize").onchange=$("fSort").onchange=render;
$("fAvail").onclick=()=>{onlyAvail=!onlyAvail;render()};
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)openView(items.find(i=>i.id===c.dataset.id))};

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch{return false}}

function openView(it,idx=0){
  if(!it)return;const ph=it.photos||[],s=status(it);
  history.replaceState(null,"","#"+it.id);
  $("view").innerHTML=`${ph.length?`<div class="gal"><img src="${esc(ph[idx])}" alt="">${ph.length>1?`<button class="nav l" data-i="${(idx-1+ph.length)%ph.length}">‹</button><button class="nav r" data-i="${(idx+1)%ph.length}">›</button>`:""}</div>${ph.length>1?`<div class="dots">${ph.map((_,k)=>`<span class="${k===idx?"on":""}"></span>`).join("")}</div>`:""}`:""}
  <div class="dlg ${s==="sold"?"sold":""}"><div class="brand">${esc(it.brand)}${ST[s]?` · <span style="color:${s==="sold"?"var(--danger)":"#d98a00"}">${ST[s]}</span>`:""}</div>
  <h2 style="margin:4px 0">${esc(it.name)}</h2><div class="price">${fmt(it.price)}</div>
  <div class="tags">${[["狀況",it.condition],["尺寸",it.size],["類別",it.category]].filter(x=>x[1]).map(x=>`<span class="tag">${x[0]}：${esc(x[1])}</span>`).join("")}</div>
  <div class="desc">${esc(it.desc)}</div>
  <div class="row"><button id="share">分享</button>${s!=="sold"&&site.line?`<button class="btn line" id="askLine">LINE 詢問</button>`:""}${s!=="sold"&&site.ig?`<button class="btn ig" id="ask">IG 私訊詢問</button>`:""}<button class="pri" id="close">關閉</button></div></div>`;
  $("view").querySelectorAll(".nav").forEach(b=>b.onclick=()=>openView(it,+b.dataset.i));
  $("close").onclick=()=>$("viewDlg").close();
  const msg=`你好，想詢問：${it.brand} ${it.name}${it.size?" / "+it.size:""}${it.price?"（"+fmt(it.price)+"）":""}\n${shareUrl(it)}`;
  $("share").onclick=async()=>{const u=shareUrl(it);if(navigator.share)navigator.share({title:it.brand+" "+it.name,url:u}).catch(()=>{});else if(await copy(u))toast("已複製連結")};
  if($("ask"))$("ask").onclick=async()=>{if(await copy(msg))toast("已複製詢問內容，貼到 IG 私訊即可");window.open("https://ig.me/m/"+encodeURIComponent(site.ig),"_blank","noopener")};
  if($("askLine"))$("askLine").onclick=async()=>{if(await copy(msg))toast("已複製詢問內容，貼到 LINE 即可");window.open(lineUrl(site.line),"_blank","noopener")};
  if(!$("viewDlg").open)$("viewDlg").showModal();
}
$("viewDlg").onclose=()=>history.replaceState(null,"",location.pathname);

fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  site=d.site||{};items=d.items||[];
  if(site.title){$("title").textContent=site.title;document.title=site.title}
  if(site.ig){$("igTop").hidden=false;$("igTop").href="https://instagram.com/"+encodeURIComponent(site.ig)}
  if(site.line){$("lineTop").hidden=false;$("lineTop").href=lineUrl(site.line)}
  fillFilters();render();
  const h=decodeURIComponent(location.hash.slice(1));if(h)openView(items.find(i=>i.id===h));
}).catch(()=>{$("empty").textContent="讀取失敗，請重新整理"});
</script>
</body></html>
